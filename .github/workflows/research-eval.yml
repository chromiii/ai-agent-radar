name: Research usability evaluation

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      mode:
        description: Verification level
        type: choice
        default: retrieval
        options: [replay, retrieval, live]
      case:
        description: Usability case
        type: choice
        default: medical-agent-trends
        options:
          - medical-agent-trends
          - coding-agent-learning
          - mcp-application-value
          - multi-agent-application
          - agent-memory-changes
          - agentic-rag-learning
          - medical-agent-engineering
          - weak-week
          - all

permissions:
  contents: read

concurrency:
  group: research-eval-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  evaluate:
    # Secrets are used only for manually selected runs or the owner's in-repo PR.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      ((github.event.label.name == 'research-live-test' || github.event.label.name == 'research-live-suite') &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.author_association == 'OWNER')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Evaluate selected scenario
        env:
          EVAL_MODE: ${{ inputs.mode || 'live' }}
          EVAL_CASE: ${{ github.event.label.name == 'research-live-suite' && 'all' || inputs.case || 'medical-agent-trends' }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ "$EVAL_MODE" = "live" ] && [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "::error::Repository secret DEEPSEEK_API_KEY is unavailable to this run."
            exit 1
          fi
          if [ "$EVAL_CASE" = "all" ]; then
            python research_eval.py --mode "$EVAL_MODE" --output eval_results/evaluation.json
          else
            python research_eval.py --mode "$EVAL_MODE" --case "$EVAL_CASE" --output eval_results/evaluation.json
          fi
      - name: Preview Weekly learning cards
        if: >-
          always() && (github.event.label.name == 'research-live-suite' ||
          (inputs.case == 'all' && inputs.mode == 'live'))
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python weekly_trends.py
          python - <<'PY'
          import json, shutil
          from pathlib import Path
          state = json.loads(Path('state/trending_terms.json').read_text())
          cards = state.get('curated', {}).get('learning_cards', [])
          output = Path('eval_results')
          output.mkdir(exist_ok=True)
          (output / 'weekly-preview.json').write_text(json.dumps(state, ensure_ascii=False, indent=2))
          shutil.copyfile(sorted(Path('weekly').glob('*.md'))[-1], output / 'weekly-preview.md')
          print(f'Weekly preview: {len(cards)} learning cards; no email or report commit.')
          if not cards:
              raise SystemExit('Weekly preview produced no learning cards.')
          PY
      - name: Show evaluation answers
        if: always()
        run: |
          if [ -f eval_results/evaluation.md ]; then
            cat eval_results/evaluation.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve evaluation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-evaluation
          path: eval_results/
          retention-days: 7
