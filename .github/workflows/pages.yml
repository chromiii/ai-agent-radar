name: Publish Radar Reader

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: [AI Agent Radar, AI Company Radar, Agent Weekly Trend Radar]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: radar-pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/configure-pages@v5
      - run: pip install -r requirements.txt
      - name: Build Radar reader
        run: python radar_reader.py --output _site/index.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Radar reader
        id: deployment
        uses: actions/deploy-pages@v4
