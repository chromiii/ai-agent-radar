name: Update Public Learning Progress

on:
  workflow_dispatch:
    inputs:
      kind:
        description: Progress type
        required: true
        type: choice
        options: [lesson, card]
        default: lesson
      item_id:
        description: Lesson lc01-... or learning card lc-... ID
        required: true
        type: string
      status:
        description: User-selected progress state
        required: true
        type: choice
        options: [studying, practiced, reviewed, skipped, reset, saved, studied]
      weekly_date:
        description: Weekly report YYYY-MM-DD for card IDs (blank = latest)
        required: false
        type: string

permissions:
  contents: write
concurrency:
  group: learning-progress-${{ github.ref }}
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Explicit progress update
        env:
          PROGRESS_KIND: ${{ inputs.kind }}
          PROGRESS_ITEM: ${{ inputs.item_id }}
          PROGRESS_STATUS: ${{ inputs.status }}
          PROGRESS_WEEK: ${{ inputs.weekly_date }}
        run: |
          if [ "$PROGRESS_KIND" = 'lesson' ]; then
            python learning_path.py mark "$PROGRESS_ITEM" "$PROGRESS_STATUS"
          elif [ "$PROGRESS_KIND" = 'card' ]; then
            if [ -n "$PROGRESS_WEEK" ]; then
              case "$PROGRESS_WEEK" in
                ????-??-??) ;;
                *) echo 'weekly_date must be YYYY-MM-DD' >&2; exit 2 ;;
              esac
              python learning_memory.py mark "$PROGRESS_ITEM" "$PROGRESS_STATUS" --weekly "weekly/$PROGRESS_WEEK.md"
            else
              python learning_memory.py mark "$PROGRESS_ITEM" "$PROGRESS_STATUS"
            fi
          else
            echo 'Unknown progress kind' >&2; exit 2
          fi
      - name: Commit public progress only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state/learning_path.json state/learning_progress.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record explicit learning progress'
          git pull --rebase --autostash origin main
          git push origin main
