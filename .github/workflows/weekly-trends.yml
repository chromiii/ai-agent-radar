name: Agent Weekly Trend Radar

on:
  workflow_dispatch:
  schedule:
    # Saturday 10:00 AEST / 11:00 AEDT. UTC schedule keeps delivery on Saturday year-round in Sydney.
    - cron: "0 0 * * 6"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
  QQ_MAIL_USERNAME: ${{ secrets.QQ_MAIL_USERNAME }}
  QQ_MAIL_PASSWORD: ${{ secrets.QQ_MAIL_PASSWORD }}
  QQ_MAIL_TO: ${{ secrets.QQ_MAIL_TO }}
  QQ_SMTP_HOST: ${{ secrets.QQ_SMTP_HOST }}
  QQ_SMTP_PORT: ${{ secrets.QQ_SMTP_PORT }}
  QQ_MAIL_FROM: ${{ secrets.QQ_MAIL_FROM }}

concurrency:
  group: agent-weekly-trends-${{ github.ref }}
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run weekly trend radar
        run: python weekly_trends.py

      - name: Commit weekly trend radar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weekly/*.md state/trending_terms.json
          if git diff --cached --quiet; then
            echo "No weekly trend changes to commit."
            exit 0
          fi
          git commit -m "Add weekly agent trend radar"
          git pull --rebase --autostash origin main
          git push origin main

      - name: Send weekly learning radar email
        run: |
          REPORT_PATH="$(ls -1t weekly/*.md | head -n 1)"
          python send_email.py "$REPORT_PATH" "AI Agent 应用层学习周报"
