name: Agent Weekly Trend Radar

on:
  workflow_dispatch:
  schedule:
    # Saturday 10:00 AEST / 11:00 AEDT. UTC schedule keeps delivery on Saturday year-round in Sydney.
    - cron: "0 0 * * 6"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
  QQ_MAIL_USERNAME: ${{ secrets.QQ_MAIL_USERNAME }}
  QQ_MAIL_PASSWORD: ${{ secrets.QQ_MAIL_PASSWORD }}
  QQ_MAIL_TO: ${{ secrets.QQ_MAIL_TO }}
  QQ_SMTP_HOST: ${{ secrets.QQ_SMTP_HOST }}
  QQ_SMTP_PORT: ${{ secrets.QQ_SMTP_PORT }}
  QQ_MAIL_FROM: ${{ secrets.QQ_MAIL_FROM }}

concurrency:
  group: agent-weekly-trends-${{ github.ref }}
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run weekly trend radar
        run: python weekly_trends.py

      - name: Commit weekly trend radar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weekly/*.md state/trending_terms.json
          if git diff --cached --quiet; then
            echo "No weekly trend changes to commit."
            exit 0
          fi
          git commit -m "Add weekly agent trend radar"
          git pull --rebase --autostash origin main
          git push origin main

      - name: Build weekly combined briefing
        run: |
          python breaking_news.py scan --lookback-days 7 > /dev/null
          python weekly_briefing.py

      - name: Render HTML newsletter
        run: |
          REPORT_PATH="$(ls -1 briefings/*.md | sort | tail -n 1)"
          python email_render.py "$REPORT_PATH" --output "${REPORT_PATH%.md}.html"

      - name: Commit combined weekly briefing and Breaking queue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add briefings/*.md briefings/*.html state/breaking_queue.json
          if ! git diff --cached --quiet; then
            git commit -m "Add one weekly consolidated learning and news briefing"
            git pull --rebase --autostash origin main
            git push origin main
          fi

      - name: Send one weekly briefing email
        run: |
          REPORT_PATH="$(ls -1 briefings/*.md | sort | tail -n 1)"
          python send_email.py "$REPORT_PATH" "AI Agent Radar · 周度学习与情报"

      - name: Prune old raw news archives after delivery
        run: python archive_retention.py --apply --raw-days 14 --weekly-keep 2 --briefing-keep 4

      - name: Commit rolling archive cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u inbox company weekly briefings
          if git diff --cached --quiet; then
            echo "No expired news archives."
            exit 0
          fi
          git commit -m "Prune old raw Radar reports after weekly delivery"
          git pull --rebase --autostash origin main
          git push origin main
