<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <title>AI Agent Radar · 主题图谱</title>
  <style>
    :root {
      color-scheme: light; --paper: #f3f6f0; --white: #fdfefa; --ink: #182923;
      --muted: #4b6459; --line: #cad8cf; --teal: #145a48; --wash: #e1efe5;
      font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; color: var(--ink); background: var(--paper); line-height: 1.5; }
    main { width: min(1230px, 100%); margin: auto; padding: 32px 29px 52px; }
    header { display: flex; justify-content: space-between; flex-wrap: wrap; align-items: end; gap: 10px; }
    h1, h2, h3, p { margin: 0; }
    h1 { font-size: clamp(1.8rem, 4vw, 3rem); line-height: 1.1; letter-spacing: -.045em; }
    h2 { font-size: .91rem; font-weight: 700; margin-bottom: 12px; }
    h3 { font-size: 1.02rem; line-height: 1.35; overflow-wrap: anywhere; }
    .meta, .status { color: var(--muted); font-size: .84rem; }
    .status { margin: 0 0 12px; }
    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin: 24px 0 14px; }
    button, select {
      min-height: 38px; padding: 6px 12px; border-radius: 7px; color: var(--ink);
      background: var(--white); border: 1px solid var(--line); font: inherit;
    }
    button { cursor: pointer; }
    button:hover { border-color: var(--teal); }
    button[aria-pressed="true"] { border-color: var(--teal); background: var(--teal); color: #fff; }
    :focus-visible { outline: 3px solid #1e795f; outline-offset: 2px; }
    .graph-board {
      position: relative; display: grid; grid-template-columns: minmax(145px, .86fr) minmax(160px, 1.04fr) minmax(250px, 1.7fr);
      gap: 36px; padding: 22px 20px 25px; border: 1px solid var(--line); border-radius: 13px;
      background-color: #eaf1e9; background-image: radial-gradient(#cadbd0 1px, transparent 1px);
      background-size: 15px 15px;
    }
    .column { position: relative; z-index: 1; min-width: 0; }
    .nodes, .cards { display: grid; gap: 9px; }
    .node { text-align: left; min-height: 47px; white-space: normal; overflow-wrap: anywhere; }
    .node[aria-pressed="true"] { background: var(--wash); color: var(--teal); box-shadow: inset 3px 0 var(--teal); }
    #edges { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    #edges path { fill: none; stroke: #658d79; stroke-width: 1.6; }
    #edges path.active-edge { stroke: #27735d; stroke-width: 2; }
    .card { padding: 13px; background: var(--white); border: 1px solid var(--line); border-radius: 9px; min-width: 0; }
    .card h3 { margin: 5px 0; }
    .card p { overflow-wrap: anywhere; }
    .card .excerpt { font-size: .9rem; }
    .card footer { display: flex; gap: 9px; justify-content: space-between; align-items: center; flex-wrap: wrap; margin-top: 10px; }
    .sources, .actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .sources a { color: var(--teal); font-size: .84rem; overflow-wrap: anywhere; }
    .actions button { min-height: 32px; padding: 4px 8px; font-size: .8rem; }
    .archive { max-width: 800px; }
    .filters { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin: 4px 0 12px; }
    .filters label { color: var(--muted); font-size: .86rem; }
    #storage-error { padding: 8px; background: #f9eeda; color: #663c09; }
    @media (max-width: 810px) {
      main { padding: 24px 14px 38px; }
      .graph-board { grid-template-columns: 1fr; gap: 23px; padding: 15px 13px; }
      .column + .column::before { content: ''; position: absolute; top: -18px; left: 10px; height: 13px; border-left: 2px solid #27735d; }
      .column h2 { margin-bottom: 7px; }
      #edges { display: none; }
      .nodes { display: flex; flex-wrap: wrap; gap: 6px; }
      .node { min-height: 37px; }
    }
  </style>
</head>
<body>
  <main>
    <header><h1>AI Agent Radar</h1><p id="snapshot" class="meta"></p></header>
    <nav class="toolbar" aria-label="阅读视图">
      <button type="button" data-mode="graph" aria-pressed="true">主题图谱</button>
      <button type="button" data-mode="all" aria-pressed="false">全部内容</button>
      <button type="button" data-mode="saved" aria-pressed="false">收藏</button>
    </nav>
    <p id="storage-error" class="status" role="status" hidden>浏览器无法保存阅读状态。收藏和已读仅在本次打开时有效。</p>
    <section id="topic-graph" aria-label="主题图谱">
      <p id="graph-status" class="status"></p>
      <div id="graph-board" class="graph-board">
        <svg id="edges" xmlns="http://www.w3.org/2000/svg" role="presentation" aria-hidden="true"></svg>
        <section class="column" aria-labelledby="themes-heading">
          <h2 id="themes-heading">主题</h2><div id="themes" class="nodes"></div>
        </section>
        <section class="column" aria-labelledby="subtopics-heading">
          <h2 id="subtopics-heading">小词条</h2><div id="subtopics" class="nodes"></div>
        </section>
        <section class="column" aria-labelledby="evidence-heading">
          <h2 id="evidence-heading">关联内容</h2><div id="evidence" class="cards"></div>
        </section>
      </div>
    </section>
    <section id="archive" class="archive" aria-label="内容列表" hidden>
      <div class="filters" aria-label="筛选条目">
        <label>时间 <select id="period">
          <option value="7">近 7 天</option><option value="14">近 14 天</option><option value="0">全部日期</option>
        </select></label>
        <label><input type="checkbox" id="unread"> 仅未读</label>
      </div>
      <p id="results-status" class="status" role="status" tabindex="-1"></p>
      <div id="results" class="cards"></div>
    </section>
    <noscript>启用 JavaScript 可浏览主题图谱和收藏。</noscript>
  </main>
  <script id="feed-data" type="application/json">/* RADAR_DATA */</script>
  <script>/* RADAR_SCRIPT */</script>
</body>
</html>
